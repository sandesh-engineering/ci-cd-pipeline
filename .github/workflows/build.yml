name: Docker image build for backend and frontend

on:
  workflow_call:

jobs:
  build-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Build and push backend image
        uses: docker/build-push-action@v6.18.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nodejs-api:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/nodejs-api:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/nodejs-api:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/nodejs-api:buildcache,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6.18.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nextjs-app:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/nextjs-app:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/nextjs-app:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/nextjs-app:buildcache,mode=max
